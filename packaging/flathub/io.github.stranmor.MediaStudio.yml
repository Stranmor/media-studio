app-id: io.github.stranmor.MediaStudio

runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk

command: media-studio

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

add-extensions:
  org.freedesktop.Platform.codecs-extra:
    directory: lib/codecs-extra
    version: "25.08-extra"
    add-ld-path: lib

# Strict standalone package. Dolphin service menus, user-systemd watch-folders,
# host dialogs, and host filesystem access belong to the native package instead.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-config/media-studio:create
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=xdg-music
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: media-studio
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/media-studio/cargo
        CARGO_NET_OFFLINE: "true"
    sources:
      - type: git
        url: https://github.com/Stranmor/media-studio.git
        tag: v0.2.5
        commit: d314bd4aa4da74b6047c67a283606950c3421542
      - cargo-sources.json
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --locked --verbose
      - cargo --offline build --release --locked --verbose
      - install -Dm755 target/release/media-studio /app/bin/media-studio
      - install -Dm644 packaging/flatpak/io.github.stranmor.MediaStudio.desktop /app/share/applications/io.github.stranmor.MediaStudio.desktop
      - install -Dm644 packaging/flatpak/io.github.stranmor.MediaStudio.metainfo.xml /app/share/metainfo/io.github.stranmor.MediaStudio.metainfo.xml
      - install -Dm644 packaging/flatpak/icons/hicolor/128x128/apps/io.github.stranmor.MediaStudio.png /app/share/icons/hicolor/128x128/apps/io.github.stranmor.MediaStudio.png
      - install -Dm644 packaging/flatpak/icons/hicolor/256x256/apps/io.github.stranmor.MediaStudio.png /app/share/icons/hicolor/256x256/apps/io.github.stranmor.MediaStudio.png
      - install -Dm644 LICENSE /app/share/licenses/io.github.stranmor.MediaStudio/LICENSE
      - install -d /app/lib/codecs-extra
      - ln -srv /usr/bin/ffmpeg /app/bin/ffmpeg
      - ln -srv /usr/bin/ffprobe /app/bin/ffprobe
