app-id: io.github.stranmor.MediaStudio
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: media-studio
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
finish-args:
  - --share=ipc
  - --socket=session-bus
  - --device=dri
  - --filesystem=home
  - --filesystem=host
  - --filesystem=xdg-config/media-studio:create
  - --filesystem=xdg-config/systemd/user
  - --filesystem=xdg-data/kio
  - --filesystem=xdg-state
  - --talk-name=org.freedesktop.systemd1
  - --talk-name=org.freedesktop.Flatpak
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: media-studio
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    sources:
      - type: git
        url: https://github.com/Stranmor/media-studio.git
        commit: 63dc708153b76ab7f7527579f103ce24ac106872
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/media-studio /app/bin/media-studio
      - install -Dm755 packaging/flatpak/host-tool-wrapper /app/bin/media-studio-host-tool
      - for tool in ffmpeg ffprobe magick systemd-run systemctl kbuildsycoca6 kbuildsycoca5 zenity kdialog; do ln -s media-studio-host-tool /app/bin/$tool; done
      - install -Dm644 packaging/flatpak/io.github.stranmor.MediaStudio.desktop /app/share/applications/io.github.stranmor.MediaStudio.desktop
