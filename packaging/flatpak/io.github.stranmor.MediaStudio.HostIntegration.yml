# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json

# Experimental Dolphin/host integration. This intentionally delegates media
# and desktop helpers to the host and is not a strict sandbox.
app-id: io.github.stranmor.MediaStudio.HostIntegration
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: media-studio
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
finish-args:
  - --share=ipc
  - --socket=session-bus
  - --device=dri
  - --filesystem=home
  - --filesystem=host
  - --filesystem=xdg-config/media-studio:create
  - --filesystem=xdg-config/systemd/user
  - --filesystem=xdg-data/kio
  - --talk-name=org.freedesktop.systemd1
  - --talk-name=org.freedesktop.Flatpak
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: media-studio
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    sources:
      - type: dir
        path: ../..
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/media-studio /app/bin/media-studio
      - install -Dm755 packaging/flatpak/host-tool-wrapper /app/bin/media-studio-host-tool
      - for tool in ffmpeg ffprobe magick systemd-run systemctl kbuildsycoca6 kbuildsycoca5 zenity kdialog; do ln -s media-studio-host-tool /app/bin/$tool; done
      - install -Dm644 packaging/flatpak/io.github.stranmor.MediaStudio.HostIntegration.desktop /app/share/applications/io.github.stranmor.MediaStudio.HostIntegration.desktop
