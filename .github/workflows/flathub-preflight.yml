name: Flathub preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: static-submission-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install metadata validators
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils imagemagick ruby
      - name: Verify Flathub submission contract
        run: packaging/flathub/verify-submission.sh
      - name: Verify top-level submission export
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$(mktemp -d)"
          packaging/flathub/export-submission.sh "$export_dir"
          test -s "$export_dir/io.github.stranmor.MediaStudio.yml"
          test -s "$export_dir/cargo-sources.json"
          test "$(find "$export_dir" -maxdepth 1 -type f | wc -l)" -eq 2

  build-and-smoke:
    name: strict-sandbox-build
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - name: Prepare container machine identity
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /etc/machine-id ]; then
            if command -v dbus-uuidgen >/dev/null 2>&1; then
              dbus-uuidgen --ensure=/etc/machine-id
            elif command -v systemd-machine-id-setup >/dev/null 2>&1; then
              systemd-machine-id-setup
            else
              tr -d '-' < /proc/sys/kernel/random/uuid > /etc/machine-id
            fi
          fi
          test -s /etc/machine-id
      - uses: actions/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify Flatpak toolchain
        run: |
          set -eu
          flatpak --version
          flatpak-builder --version
      - name: Install Flathub SDK and runtime
        shell: bash
        run: |
          set -euo pipefail
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Build strict Flathub bundle
        shell: bash
        run: |
          set -euo pipefail
          flatpak-builder --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --repo=repo build-dir packaging/flathub/io.github.stranmor.MediaStudio.yml
          flatpak build-bundle repo "media-studio-flathub-${GITHUB_SHA}.flatpak" io.github.stranmor.MediaStudio
          test -s "media-studio-flathub-${GITHUB_SHA}.flatpak"
      - name: Install and smoke-test strict bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="media-studio-flathub-${GITHUB_SHA}.flatpak"
          timeout 900s flatpak install --user --noninteractive --or-update "$bundle"
          flatpak info --user io.github.stranmor.MediaStudio
          version_output="$(timeout 30s flatpak run --command=media-studio io.github.stranmor.MediaStudio --version)"
          printf '%s\n' "$version_output"
          expected_version="$(awk -F'"' '$1 == "version = " { print $2; exit }' Cargo.toml)"
          test -n "$expected_version"
          printf '%s\n' "$version_output" | grep -F "media-studio $expected_version"
          timeout 30s flatpak run --command=media-studio io.github.stranmor.MediaStudio profile list > /tmp/media-studio-flathub-profiles.txt
          grep -F $'video_mp4\t' /tmp/media-studio-flathub-profiles.txt
