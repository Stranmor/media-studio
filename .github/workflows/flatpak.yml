name: Flatpak

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to build
        required: false
        type: string
        default: ""
      publish_bundle:
        description: Upload Flatpak bundles for a release
        required: false
        type: boolean
        default: false
      release_gate:
        description: Run this workflow as a release gate
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  manifest-contract:
    name: manifest-contract
    if: >-
      github.repository == 'Stranmor/media-studio' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (inputs.release_gate == true && inputs.publish_bundle == true &&
      startsWith(github.ref, 'refs/tags/v') &&
      inputs.checkout_ref == github.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify canonical manifest contracts
        run: |
          set -euo pipefail
          ruby packaging/flatpak/verify-manifest-parity.rb sandbox \
            packaging/flatpak/io.github.stranmor.MediaStudio.yml \
            packaging/flatpak/io.github.stranmor.MediaStudio.sandbox.ci.yml
          ruby packaging/flatpak/verify-manifest-parity.rb host-integration \
            packaging/flatpak/io.github.stranmor.MediaStudio.HostIntegration.yml \
            packaging/flatpak/io.github.stranmor.MediaStudio.HostIntegration.ci.yml

  build-and-smoke:
    name: ${{ matrix.kind }}
    needs: manifest-contract
    if: >-
      github.repository == 'Stranmor/media-studio' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (inputs.release_gate == true && inputs.publish_bundle == true &&
      startsWith(github.ref, 'refs/tags/v') &&
      inputs.checkout_ref == github.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: sandbox
            app_id: io.github.stranmor.MediaStudio
            manifest_path: packaging/flatpak/io.github.stranmor.MediaStudio.sandbox.ci.yml
            bundle: media-studio-sandbox.flatpak
          - kind: host-integration
            app_id: io.github.stranmor.MediaStudio.HostIntegration
            manifest_path: packaging/flatpak/io.github.stranmor.MediaStudio.HostIntegration.ci.yml
            bundle: media-studio-host-integration.flatpak
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - name: Prepare container machine identity
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /etc/machine-id ]; then
            if command -v dbus-uuidgen >/dev/null 2>&1; then
              dbus-uuidgen --ensure=/etc/machine-id
            elif command -v systemd-machine-id-setup >/dev/null 2>&1; then
              systemd-machine-id-setup
            else
              tr -d '-' < /proc/sys/kernel/random/uuid > /etc/machine-id
            fi
          fi
          test -s /etc/machine-id
      - uses: actions/checkout@main
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify Flatpak toolchain
        run: |
          set -eu
          flatpak --version
          flatpak-builder --version
      - uses: flatpak/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: ${{ matrix.bundle }}
          manifest-path: ${{ matrix.manifest_path }}
          repository-name: flathub
          repository-url: https://flathub.org/repo/flathub.flatpakrepo
          upload-artifact: false
          verbose: true
      - name: Install and run packaged conversion
        shell: bash
        env:
          APP_ID: ${{ matrix.app_id }}
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          timeout 900s flatpak install --user --noninteractive --or-update "./${{ matrix.bundle }}"
          flatpak info --user "$APP_ID"
          version_output="$(timeout 30s flatpak run --command=media-studio "$APP_ID" --version)"
          printf '%s\n' "$version_output"
          expected_version="$(awk -F'"' '$1 == "version = " { print $2; exit }' Cargo.toml)"
          test -n "$expected_version"
          printf '%s\n' "$version_output" | grep -F "media-studio $expected_version"
          if [ "$KIND" = host-integration ]; then
            tool_contract="$(timeout 30s flatpak run --env=MEDIA_STUDIO_HOST_TOOL_MODE=runtime --command=sh "$APP_ID" -c 'set -eu; command -v ffmpeg; command -v ffprobe; ffmpeg -hide_banner -encoders')"
          else
            tool_contract="$(timeout 30s flatpak run --command=sh "$APP_ID" -c 'set -eu; command -v ffmpeg; command -v ffprobe; ffmpeg -hide_banner -encoders')"
          fi
          printf '%s\n' "$tool_contract"
          printf '%s\n' "$tool_contract" | grep -F 'ffmpeg'
          printf '%s\n' "$tool_contract" | grep -F 'ffprobe'
          printf '%s\n' "$tool_contract" | grep -E '(^|[[:space:]])libx264([[:space:]]|$)'
          timeout 30s flatpak run --command=media-studio "$APP_ID" profile list >"/tmp/media-studio-flatpak-profiles-${KIND}.txt"
          grep -F $'video_mp4\t' "/tmp/media-studio-flatpak-profiles-${KIND}.txt"
          proof_dir="$HOME/Downloads/media-studio-flatpak-${GITHUB_RUN_ID}-${KIND}"
          if [ "$KIND" = host-integration ]; then
            export MEDIA_STUDIO_FLATPAK_HOST_SMOKE_MODE=runtime
          fi
          packaging/flatpak/conversion-smoke.sh "$APP_ID" "$proof_dir"
          mkdir -p "flatpak-proof/$KIND"
          printf '%s\n' "$GITHUB_SHA" > "$proof_dir/source-sha.txt"
          cp "$proof_dir/receipt.txt" "$proof_dir/job.log" "$proof_dir/output.mp4" "$proof_dir/output.sha256" "$proof_dir/source-sha.txt" "flatpak-proof/$KIND/"
      - name: Upload conversion receipt
        if: success()
        uses: actions/upload-artifact@main
        with:
          name: media-studio-flatpak-smoke-${{ matrix.kind }}-${{ github.run_id }}
          path: flatpak-proof/${{ matrix.kind }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload release bundle
        if: success() && inputs.publish_bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p flatpak-release
          cp "${{ matrix.bundle }}" "flatpak-release/${{ matrix.bundle }}"
          printf '%s\n' "$GITHUB_SHA" > "flatpak-release/${{ matrix.bundle }}.source-sha"
      - name: Publish release bundle artifact
        if: success() && inputs.publish_bundle
        uses: actions/upload-artifact@main
        with:
          name: media-studio-flatpak-${{ matrix.kind }}
          path: flatpak-release/*
          if-no-files-found: error
