name: Flatpak

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to build
        required: false
        type: string
        default: ""
      publish_bundle:
        description: Upload Flatpak bundles for a release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: ${{ matrix.kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: sandbox
            app_id: io.github.stranmor.MediaStudio
            manifest_path: packaging/flatpak/io.github.stranmor.MediaStudio.sandbox.ci.yml
            bundle: media-studio-sandbox.flatpak
          - kind: host-integration
            app_id: io.github.stranmor.MediaStudio.HostIntegration
            manifest_path: packaging/flatpak/io.github.stranmor.MediaStudio.HostIntegration.ci.yml
            bundle: media-studio-host-integration.flatpak
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - name: Prepare container machine identity
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /etc/machine-id ]; then
            if command -v dbus-uuidgen >/dev/null 2>&1; then
              dbus-uuidgen --ensure=/etc/machine-id
            elif command -v systemd-machine-id-setup >/dev/null 2>&1; then
              systemd-machine-id-setup
            else
              tr -d '-' < /proc/sys/kernel/random/uuid > /etc/machine-id
            fi
          fi
          test -s /etc/machine-id
      - uses: actions/checkout@main
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Verify Flatpak toolchain
        run: |
          set -eu
          flatpak --version
          flatpak-builder --version
      - uses: flatpak/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: ${{ matrix.bundle }}
          manifest-path: ${{ matrix.manifest_path }}
          repository-name: flathub
          repository-url: https://flathub.org/repo/flathub.flatpakrepo
          upload-artifact: false
          verbose: true
      - name: Install and run packaged conversion
        shell: bash
        env:
          APP_ID: ${{ matrix.app_id }}
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          timeout 900s flatpak install --user --noninteractive --or-update "./${{ matrix.bundle }}"
          flatpak info --user "$APP_ID"
          version_output="$(timeout 30s flatpak run --command=media-studio "$APP_ID" --version)"
          printf '%s\n' "$version_output"
          printf '%s\n' "$version_output" | grep -F 'media-studio 0.2.1'
          timeout 30s flatpak run --command=media-studio "$APP_ID" profile list >"/tmp/media-studio-flatpak-profiles-${KIND}.txt"
          grep -F $'video_mp4\t' "/tmp/media-studio-flatpak-profiles-${KIND}.txt"
          proof_dir="$HOME/Downloads/media-studio-flatpak-${GITHUB_RUN_ID}-${KIND}"
          packaging/flatpak/conversion-smoke.sh "$APP_ID" "$proof_dir"
          mkdir -p "flatpak-proof/$KIND"
          cp "$proof_dir/receipt.txt" "$proof_dir/job.log" "$proof_dir/output.sha256" "flatpak-proof/$KIND/"
      - name: Upload conversion receipt
        if: success()
        uses: actions/upload-artifact@main
        with:
          name: media-studio-flatpak-smoke-${{ matrix.kind }}-${{ github.run_id }}
          path: flatpak-proof/${{ matrix.kind }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload release bundle
        if: success() && inputs.publish_bundle
        uses: actions/upload-artifact@main
        with:
          name: media-studio-flatpak-${{ matrix.kind }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
