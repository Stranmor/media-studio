name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to test
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  kde-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install KDE and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 dolphin ffmpeg imagemagick kio-extras xvfb zenity
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Prepare user-systemd queue consumer
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          runtime_dir="/run/user/$uid"
          sudo loginctl enable-linger "$USER" || true
          sudo systemctl start "user@$uid.service" || true
          for _ in $(seq 1 30); do
            if [ -S "$runtime_dir/bus" ]; then
              break
            fi
            sleep 1
          done
          test -S "$runtime_dir/bus"
          DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus" systemctl --user show-environment >/dev/null
          printf 'XDG_RUNTIME_DIR=%s\n' "$runtime_dir" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' "$runtime_dir" >> "$GITHUB_ENV"
      - name: Verify installed Dolphin consumer and conversion
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$(mktemp -d)"
          mkdir -p "$proof_dir/in" "$proof_dir/out" "$proof_dir/home"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x240:rate=10:duration=1 -c:v libx264 "$proof_dir/in/input.mp4"
          cp "$proof_dir/in/input.mp4" "$proof_dir/in/queue.mp4"
          cp "$proof_dir/in/input.mp4" "$proof_dir/in/direct.mp4"
          export HOME="$proof_dir/home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state"
          dbus-run-session -- target/release/media-studio install
          test "$(find "$XDG_DATA_HOME/kio/servicemenus" -name 'media-studio-*.desktop' | wc -l)" -eq 3
          menu_file="$XDG_DATA_HOME/kio/servicemenus/media-studio-video.desktop"
          grep -Fx "Exec=\"$HOME/.local/bin/media-studio\" enqueue --profile video_mp4 %F" "$menu_file"
          queue_output="$("$HOME/.local/bin/media-studio" enqueue --profile video_mp4 -- "$proof_dir/in/queue.mp4")"
          printf '%s\n' "$queue_output"
          queue_job_id="$(sed -n 's/^QUEUED job_id=\([^ ]*\).*/\1/p' <<<"$queue_output")"
          test -n "$queue_job_id"
          queue_status="$XDG_STATE_HOME/media-studio/jobs/$queue_job_id.status"
          for _ in $(seq 1 60); do
            queue_state="$(sed -n 's/^state=//p' "$queue_status" 2>/dev/null | head -n1 || true)"
            case "$queue_state" in
              completed) break ;;
              failed|partial)
                cat "$queue_status"
                exit 1
                ;;
            esac
            sleep 1
          done
          grep -Fx 'state=completed' "$queue_status"
          queue_output_file="$proof_dir/in/queue.converted-1.mp4"
          test -s "$queue_output_file"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$queue_output_file"
          ffmpeg -hide_banner -nostdin -loglevel error -xerror -i "$queue_output_file" -map 0:v? -map 0:a? -f null -
          grep -Fx 'RESULT=verified' "$XDG_STATE_HOME/media-studio/jobs/$queue_job_id.log"
          dbus-run-session -- target/release/media-studio run --job-id ci-kde-direct-proof --profile video_mp4 -- "$proof_dir/in/direct.mp4"
          direct_output_file="$proof_dir/in/direct.converted-1.mp4"
          test -s "$direct_output_file"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$direct_output_file"
          ffmpeg -hide_banner -nostdin -loglevel error -xerror -i "$direct_output_file" -map 0:v? -map 0:a? -f null -
          cache_builder="$(command -v kbuildsycoca6 || command -v kbuildsycoca5)"
          "$cache_builder" --noincremental
          set +e
          timeout 12s xvfb-run -a dbus-run-session -- dolphin --new-window "$proof_dir/in"
          dolphin_exit=$?
          set -e
          test "$dolphin_exit" -eq 0 -o "$dolphin_exit" -eq 124

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate packaging manifests
        shell: bash
        run: |
          set -euo pipefail
          bash -n packaging/arch/PKGBUILD
          if command -v makepkg >/dev/null 2>&1; then
            (cd packaging/arch && makepkg --packagelist | grep -F 'media-studio-0.2.2-1-')
          else
            grep -F 'pkgname=media-studio' packaging/arch/PKGBUILD
            grep -F 'pkgver=0.2.2' packaging/arch/PKGBUILD
          fi
          grep -F 'source=("git+$source_repo#tag=$source_tag")' packaging/arch/PKGBUILD
          test -x packaging/arch/verify-source.sh
          ci_source_tag="ci-media-studio-${GITHUB_RUN_ID}"
          git tag "$ci_source_tag" "$(git rev-parse HEAD)"
          packaging/arch/verify-source.sh --repo . --tag "$ci_source_tag" --expected-commit "$(git rev-parse HEAD)"
          grep -F 'depends = "ffmpeg, systemd"' Cargo.toml
          grep -F 'ffmpeg = "*"' Cargo.toml
          grep -F 'systemd = "*"' Cargo.toml
          ruby packaging/flatpak/verify-manifest-parity.rb sandbox packaging/flatpak/io.github.stranmor.MediaStudio.yml packaging/flatpak/io.github.stranmor.MediaStudio.sandbox.ci.yml
          ruby packaging/flatpak/verify-manifest-parity.rb host-integration packaging/flatpak/io.github.stranmor.MediaStudio.HostIntegration.yml packaging/flatpak/io.github.stranmor.MediaStudio.HostIntegration.ci.yml
          cargo metadata --no-deps --format-version 1 >/dev/null
          test -s packaging/flatpak/io.github.stranmor.MediaStudio.desktop
          test -s packaging/flatpak/io.github.stranmor.MediaStudio.HostIntegration.desktop
          test -x packaging/flatpak/host-tool-wrapper
          test -x packaging/flatpak/conversion-smoke.sh
          test -s packaging/flatpak/verify-manifest-parity.rb
          test -x packaging/release/verify-gates.sh
          grep -F "for tool in ffmpeg ffprobe magick systemd-run systemctl kbuildsycoca6 kbuildsycoca5 zenity kdialog; do ln -s media-studio-host-tool /app/bin/\$tool; done" packaging/flatpak/io.github.stranmor.MediaStudio.HostIntegration.yml
