name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  kde-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Install KDE and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 dolphin ffmpeg imagemagick kio-extras xvfb zenity
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Verify installed Dolphin consumer and conversion
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$(mktemp -d)"
          mkdir -p "$proof_dir/in" "$proof_dir/out" "$proof_dir/home"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x240:rate=10:duration=1 -c:v libx264 "$proof_dir/in/input.mp4"
          export HOME="$proof_dir/home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state"
          dbus-run-session -- target/release/media-studio install
          test "$(find "$XDG_DATA_HOME/kio/servicemenus" -name 'media-studio-*.desktop' | wc -l)" -eq 3
          dbus-run-session -- target/release/media-studio run --job-id ci-kde-proof --profile video_mp4 -- "$proof_dir/in/input.mp4"
          test -s "$proof_dir/in/input.converted-1.mp4"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$proof_dir/in/input.converted-1.mp4"
          cache_builder="$(command -v kbuildsycoca6 || command -v kbuildsycoca5)"
          "$cache_builder" --noincremental
          set +e
          timeout 12s xvfb-run -a dbus-run-session -- dolphin --new-window "$proof_dir/in"
          dolphin_exit=$?
          set -e
          test "$dolphin_exit" -eq 0 -o "$dolphin_exit" -eq 124

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate packaging manifests
        shell: bash
        run: |
          set -euo pipefail
          bash -n packaging/arch/PKGBUILD
          if command -v makepkg >/dev/null 2>&1; then
            (cd packaging/arch && makepkg --packagelist | grep -F 'media-studio-0.2.1-1-')
          else
            grep -F 'pkgname=media-studio' packaging/arch/PKGBUILD
            grep -F 'pkgver=0.2.1' packaging/arch/PKGBUILD
          fi
          ruby -e 'require "yaml"; manifest = YAML.load_file("packaging/flatpak/io.github.stranmor.MediaStudio.yml"); abort "bad sandbox app id" unless manifest["app-id"] == "io.github.stranmor.MediaStudio"; abort "sandbox must not use host filesystem" if manifest["finish-args"].any? { |arg| arg.include?("filesystem=host") || arg.include?("socket=session-bus") || arg.include?("talk-name=") }; abort "sandbox source must track main" unless manifest.dig("modules", 0, "sources", 0, "branch") == "main"; codecs = manifest.dig("add-extensions", "org.freedesktop.Platform.codecs-extra"); abort "sandbox must expose codecs-extra" unless codecs == {"directory" => "lib/codecs-extra", "version" => "25.08-extra", "add-ld-path" => "lib"}'
          ruby -e 'require "yaml"; release = YAML.load_file("packaging/flatpak/io.github.stranmor.MediaStudio.yml"); ci = YAML.load_file("packaging/flatpak/io.github.stranmor.MediaStudio.sandbox.ci.yml"); release["modules"][0]["sources"] = [{"type" => "dir", "path" => "../.."}]; abort "CI sandbox manifest drifted from release manifest" unless release == ci'
          ruby -e 'require "yaml"; manifest = YAML.load_file("packaging/flatpak/io.github.stranmor.MediaStudio.HostIntegration.yml"); abort "bad host app id" unless manifest["app-id"] == "io.github.stranmor.MediaStudio.HostIntegration"; abort "host wrapper contract missing" unless manifest["modules"][0]["build-commands"].any? { |line| line.include?("media-studio-host-tool") }; abort "host KIO permission missing" unless manifest["finish-args"].include?("--filesystem=xdg-data/kio")'
          ruby -e 'require "yaml"; release = YAML.load_file("packaging/flatpak/io.github.stranmor.MediaStudio.HostIntegration.yml"); ci = YAML.load_file("packaging/flatpak/io.github.stranmor.MediaStudio.HostIntegration.ci.yml"); release["modules"][0]["sources"] = [{"type" => "dir", "path" => "../.."}]; abort "CI host manifest drifted from release manifest" unless release == ci'
          cargo metadata --no-deps --format-version 1 >/dev/null
          test -s packaging/flatpak/io.github.stranmor.MediaStudio.desktop
          test -s packaging/flatpak/io.github.stranmor.MediaStudio.HostIntegration.desktop
          test -x packaging/flatpak/host-tool-wrapper
          test -x packaging/flatpak/conversion-smoke.sh
          test -x packaging/release/verify-gates.sh
          grep -F "for tool in ffmpeg ffprobe magick systemd-run systemctl kbuildsycoca6 kbuildsycoca5 zenity kdialog; do ln -s media-studio-host-tool /app/bin/\$tool; done" packaging/flatpak/io.github.stranmor.MediaStudio.HostIntegration.yml
