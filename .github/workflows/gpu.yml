name: GPU Hardware Smoke

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to test
        required: false
        type: string
        default: ""
      release_gate:
        description: Run this workflow as a release gate
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hardware:
    name: ${{ matrix.backend }}
    if: >-
      github.repository == 'Stranmor/media-studio' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (inputs.release_gate == true &&
      startsWith(github.ref, 'refs/tags/v') &&
      inputs.checkout_ref == github.sha))
    runs-on: [self-hosted, linux, gpu, '${{ matrix.backend }}']
    environment: gpu-hardware
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: vaapi
            vaapi_device: /dev/dri/renderD128
          - backend: nvenc
            vaapi_device: ''
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify runner tools
        run: |
          set -eu
          command -v cargo
          command -v rustc
          command -v ffmpeg
          command -v ffprobe
          command -v systemd-run
          cargo --version
          rustc --version
      - name: Run real hardware conversion
        shell: bash
        env:
          MEDIA_STUDIO_PROOF_DIR: ${{ runner.temp }}/media-studio-${{ matrix.backend }}
          CARGO_BUILD_JOBS: 2
        run: |
          set -eu
          mkdir -p "$MEDIA_STUDIO_PROOF_DIR"
          packaging/gpu/hardware-smoke.sh '${{ matrix.backend }}' '${{ matrix.vaapi_device }}'
          printf '%s\n' "$GITHUB_SHA" > "$MEDIA_STUDIO_PROOF_DIR/source-sha.txt"
      - name: Upload hardware receipt
        if: success()
        uses: actions/upload-artifact@main
        with:
          name: media-studio-hardware-${{ matrix.backend }}
          path: ${{ runner.temp }}/media-studio-${{ matrix.backend }}
          if-no-files-found: error
