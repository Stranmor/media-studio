name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: media-studio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@main
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Arch release source identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: packaging/arch/verify-source.sh --repo https://github.com/Stranmor/media-studio.git --tag "${GITHUB_REF_NAME}" --expected-commit "$EXPECTED_SHA"
      - run: cargo build --release
      - name: Build binary and distro packages
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deb cargo-generate-rpm
          cargo deb --no-build
          cargo generate-rpm
          mkdir -p release-assets/stage
          binary="media-studio-linux-${{ matrix.arch }}"
          install -Dm755 target/release/media-studio "release-assets/stage/${binary}"
          deb="$(find target/debian -type f -name '*.deb' -print -quit)"
          rpm="$(find target/generate-rpm -type f -name '*.rpm' -print -quit)"
          test -n "$deb" -a -n "$rpm"
          cp "$deb" release-assets/
          cp "$rpm" release-assets/
          tar -czf "release-assets/${binary}.tar.gz" -C release-assets/stage "$binary"
          (cd release-assets/stage && sha256sum "${binary}") > "release-assets/${binary}.sha256"
          cp "release-assets/stage/${binary}" release-assets/
      - uses: actions/upload-artifact@main
        with:
          name: media-studio-${{ matrix.arch }}
          path: release-assets/*

  publish:
    needs: [build, arch-package, native-ci, flatpak, hardware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@main
        with:
          path: release-assets
          pattern: media-studio-x86_64
          merge-multiple: true
      - uses: actions/download-artifact@main
        with:
          path: release-assets
          pattern: media-studio-aarch64
          merge-multiple: true
      - uses: actions/download-artifact@main
        with:
          path: release-assets
          pattern: media-studio-flatpak-sandbox
          merge-multiple: true
      - uses: actions/download-artifact@main
        with:
          path: release-assets
          pattern: media-studio-flatpak-host-integration
          merge-multiple: true
      - uses: actions/download-artifact@main
        with:
          path: release-gates/hardware-vaapi
          pattern: media-studio-hardware-vaapi
          merge-multiple: true
      - uses: actions/download-artifact@main
        with:
          path: release-gates/hardware-nvenc
          pattern: media-studio-hardware-nvenc
          merge-multiple: true
      - uses: actions/download-artifact@main
        with:
          path: release-gates/flatpak-sandbox
          pattern: media-studio-flatpak-smoke-sandbox-*
          merge-multiple: true
      - uses: actions/download-artifact@main
        with:
          path: release-gates/flatpak-host-integration
          pattern: media-studio-flatpak-smoke-host-integration-*
          merge-multiple: true
      - name: Verify release media tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg rpm
          command -v ffmpeg
          command -v ffprobe
          command -v dpkg-deb
          command -v rpm
          ffmpeg -version | head -n1
          ffprobe -version | head -n1
      - name: Verify every release gate receipt
        shell: bash
        run: packaging/release/verify-gates.sh release-assets release-gates
      - name: Record release gate receipt
        shell: bash
        run: |
          set -euo pipefail
          test -s release-gates/release-gates.txt
          cp release-gates/release-gates.txt release-assets/release-gates.txt
          printf 'ref=%s\n' '${{ github.ref }}' >> release-assets/release-gates.txt
      - uses: softprops/action-gh-release@master
        with:
          files: |
            release-assets/media-studio-linux-*
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.flatpak
            release-assets/release-gates.txt

  flatpak:
    needs: build
    uses: ./.github/workflows/flatpak.yml
    with:
      checkout_ref: ${{ github.ref }}
      publish_bundle: true
    secrets: inherit

  native-ci:
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ github.ref }}

  hardware:
    needs: build
    uses: ./.github/workflows/gpu.yml
    with:
      checkout_ref: ${{ github.ref }}
    secrets: inherit

  arch-package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@main
      - name: Build Arch package in the current Arch image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Sy --noconfirm --needed base-devel git rust cargo ffmpeg kio systemd
              useradd --create-home builder
              chown -R builder:builder /workspace
              runuser -u builder -- bash -euo pipefail -c "
                cd /workspace/packaging/arch
                makepkg --noconfirm --syncdeps --cleanbuild
              "
            '
