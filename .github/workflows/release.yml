name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: media-studio-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_ref: ${{ steps.resolve.outputs.release_ref }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable release source
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$EVENT_REF_NAME"
          fi
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          git fetch --force --tags origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
          release_sha="$(git rev-parse "${release_tag}^{commit}")"
          release_ref="refs/tags/${release_tag}"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'release_ref=%s\n' "$release_ref" >> "$GITHUB_OUTPUT"
          printf 'release_sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ needs.source.outputs.release_sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.source.outputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Arch release source identity
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
        run: packaging/arch/verify-source.sh --repo https://github.com/Stranmor/media-studio.git --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_SHA"
      - run: cargo build --release
      - name: Build binary and distro packages
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.source.outputs.release_sha }}
        run: |
          set -euo pipefail
          cargo install cargo-deb cargo-generate-rpm
          cargo deb --no-build
          cargo generate-rpm
          mkdir -p release-assets/stage
          binary="media-studio-linux-${{ matrix.arch }}"
          install -Dm755 target/release/media-studio "release-assets/stage/${binary}"
          deb="$(find target/debian -type f -name '*.deb' -print -quit)"
          rpm="$(find target/generate-rpm -type f -name '*.rpm' -print -quit)"
          test -n "$deb" -a -n "$rpm"
          cp "$deb" release-assets/
          cp "$rpm" release-assets/
          tar -czf "release-assets/${binary}.tar.gz" -C release-assets/stage "$binary"
          (cd release-assets/stage && sha256sum "${binary}") > "release-assets/${binary}.sha256"
          printf '%s\n' "$RELEASE_SHA" > "release-assets/${binary}.source-sha"
          cp "release-assets/stage/${binary}" release-assets/
      - uses: actions/upload-artifact@main
        with:
          name: media-studio-${{ matrix.arch }}
          path: release-assets/*

  publish:
    needs: [source, build, arch-package, native-ci, flatpak, hardware]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Require every release gate to succeed
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          ARCH_RESULT: ${{ needs.arch-package.result }}
          NATIVE_RESULT: ${{ needs.native-ci.result }}
          FLATPAK_RESULT: ${{ needs.flatpak.result }}
          HARDWARE_RESULT: ${{ needs.hardware.result }}
        run: |
          set -euo pipefail
          for gate in \
            "build=$BUILD_RESULT" \
            "arch-package=$ARCH_RESULT" \
            "native-ci=$NATIVE_RESULT" \
            "flatpak=$FLATPAK_RESULT" \
            "hardware=$HARDWARE_RESULT"; do
            gate_name="${gate%%=*}"
            gate_result="${gate#*=}"
            if [ "$gate_result" != success ]; then
              printf 'release gate %s did not succeed: %s\n' "$gate_name" "$gate_result" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@main
        with:
          ref: ${{ needs.source.outputs.release_sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.source.outputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/download-artifact@main
        with:
          path: release-assets
          pattern: media-studio-x86_64
          merge-multiple: true
      - uses: actions/download-artifact@main
        with:
          path: release-assets
          pattern: media-studio-aarch64
          merge-multiple: true
      - uses: actions/download-artifact@main
        with:
          path: release-assets
          pattern: media-studio-flatpak-sandbox
          merge-multiple: true
      - uses: actions/download-artifact@main
        with:
          path: release-assets
          pattern: media-studio-flatpak-host-integration
          merge-multiple: true
      - uses: actions/download-artifact@main
        with:
          path: release-gates/hardware-vaapi
          pattern: media-studio-hardware-vaapi
          merge-multiple: true
      - uses: actions/download-artifact@main
        with:
          path: release-gates/hardware-nvenc
          pattern: media-studio-hardware-nvenc
          merge-multiple: true
      - uses: actions/download-artifact@main
        with:
          path: release-gates/flatpak-sandbox
          pattern: media-studio-flatpak-smoke-sandbox-*
          merge-multiple: true
      - uses: actions/download-artifact@main
        with:
          path: release-gates/flatpak-host-integration
          pattern: media-studio-flatpak-smoke-host-integration-*
          merge-multiple: true
      - name: Verify release media tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg rpm
          command -v ffmpeg
          command -v ffprobe
          command -v dpkg-deb
          command -v rpm
          ffmpeg -version | head -n1
          ffprobe -version | head -n1
      - name: Verify every release gate receipt
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.source.outputs.release_sha }}
        run: packaging/release/verify-gates.sh release-assets release-gates "$RELEASE_SHA"
      - name: Record release gate receipt
        shell: bash
        run: |
          set -euo pipefail
          test -s release-gates/release-gates.txt
          cp release-gates/release-gates.txt release-assets/release-gates.txt
          printf 'ref=%s\nsha=%s\n' '${{ needs.source.outputs.release_ref }}' '${{ needs.source.outputs.release_sha }}' >> release-assets/release-gates.txt
      - name: Prepare SPDX output directory
        shell: bash
        run: mkdir -p sbom
      - name: Generate SPDX release SBOM
        uses: anchore/sbom-action@main
        with:
          path: release-assets
          format: spdx-json
          output-file: sbom/media-studio.spdx.json
          artifact-name: media-studio-${{ needs.source.outputs.release_tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Prepare attestation subject manifests
        shell: bash
        run: |
          set -euo pipefail
          test -s sbom/media-studio.spdx.json
          install -Dm644 sbom/media-studio.spdx.json release-assets/media-studio.spdx.json
          (
            cd release-assets
            find . -maxdepth 1 -type f \
              \( -name 'media-studio-linux-x86_64' -o -name 'media-studio-linux-aarch64' \
              -o -name 'media-studio-linux-*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.flatpak' \) \
              -printf '%f\0' | sort -z | xargs -0 sha256sum --
          ) > release-assets/build-subjects.sha256
          (
            cd release-assets
            find . -maxdepth 1 -type f \
              ! -name 'release-assets.sha256' \
              ! -name '*.provenance.json' \
              ! -name '*.attestation.json' \
              -printf '%f\0' | sort -z | xargs -0 sha256sum --
          ) > release-assets/release-assets.sha256
          test -s release-assets/build-subjects.sha256
          test -s release-assets/release-assets.sha256
          (cd release-assets && sha256sum --check build-subjects.sha256)
          (cd release-assets && sha256sum --check release-assets.sha256)
      - name: Generate SLSA provenance attestation
        id: provenance
        uses: actions/attest@main
        with:
          subject-checksums: release-assets/release-assets.sha256
          show-summary: true
      - name: Preserve SLSA provenance bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          install -Dm644 "$BUNDLE_PATH" release-assets/media-studio.provenance.json
      - name: Generate SPDX SBOM attestation
        id: sbom_attestation
        uses: actions/attest@main
        with:
          subject-checksums: release-assets/build-subjects.sha256
          sbom-path: release-assets/media-studio.spdx.json
          show-summary: true
      - name: Preserve SPDX attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.sbom_attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          install -Dm644 "$BUNDLE_PATH" release-assets/media-studio.sbom.attestation.json
      - uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ needs.source.outputs.release_tag }}
          files: |
            # Keep every pattern disjoint: overlapping globs make the release
            # action upload the same checksum twice and can trigger a race.
            release-assets/media-studio-linux-x86_64
            release-assets/media-studio-linux-aarch64
            release-assets/media-studio-linux-x86_64.tar.gz
            release-assets/media-studio-linux-aarch64.tar.gz
            release-assets/media-studio-linux-x86_64.source-sha
            release-assets/media-studio-linux-aarch64.source-sha
            release-assets/media-studio-linux-x86_64.sha256
            release-assets/media-studio-linux-aarch64.sha256
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/media-studio-sandbox.flatpak
            release-assets/media-studio-host-integration.flatpak
            release-assets/media-studio-sandbox.flatpak.source-sha
            release-assets/media-studio-host-integration.flatpak.source-sha
            release-assets/media-studio.spdx.json
            release-assets/release-assets.sha256
            release-assets/build-subjects.sha256
            release-assets/media-studio.provenance.json
            release-assets/media-studio.sbom.attestation.json
            release-assets/release-gates.txt

  flatpak:
    needs: [source, build]
    uses: ./.github/workflows/flatpak.yml
    with:
      checkout_ref: ${{ needs.source.outputs.release_sha }}
      publish_bundle: true
      release_gate: true
    secrets: inherit

  native-ci:
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.source.outputs.release_sha }}

  hardware:
    needs: [source, build]
    uses: ./.github/workflows/gpu.yml
    with:
      checkout_ref: ${{ needs.source.outputs.release_sha }}
      release_gate: true
    secrets: inherit

  arch-package:
    needs: [source, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ needs.source.outputs.release_sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.source.outputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Verify Arch source identity
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
        run: packaging/arch/verify-source.sh --repo https://github.com/Stranmor/media-studio.git --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_SHA"
      - name: Build Arch package in the current Arch image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Sy --noconfirm --needed base-devel git rust cargo ffmpeg kio systemd
              useradd --create-home builder
              chown -R builder:builder /workspace
              runuser -u builder -- bash -euo pipefail -c "
                cd /workspace/packaging/arch
                makepkg --noconfirm --syncdeps --cleanbuild
              "
            '
